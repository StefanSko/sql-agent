<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Hand-rolled control</title></head>
<body>
  <h1>Hand-rolled SQL-agent control</h1>
  <main id="events"></main>
  <form><label>Question <input required></label><button>Send</button></form>
  <script>
    const form = document.querySelector('form')
    form.addEventListener('submit', async (event) => {
      event.preventDefault()
      const response = await fetch('/sse', {
        method: 'POST', headers: {'content-type': 'application/json'},
        body: JSON.stringify({prompt: form.querySelector('input').value}),
      })
      const text = await response.text()
      for (const line of text.split('\n')) {
        if (!line.startsWith('data: ')) continue
        const item = JSON.parse(line.slice(6))
        const row = document.createElement('p')
        row.textContent = `${item.kind}: ${item.content}`
        document.querySelector('#events').append(row)
      }
    })
  </script>
</body>
</html>
