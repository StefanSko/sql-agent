name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --all-groups --frozen
      - run: npm ci
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ty check
      - name: Default suite excludes e2e
        run: uv run pytest
      - name: Explicit e2e marker executes import-safe sentinel
        run: RUN_E2E_SENTINEL=1 uv run pytest -m e2e tests/e2e/test_marker_sentinel.py
